<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" color="#17160f" font-family="Archivo, Arial, Helvetica, sans-serif" role="img" aria-label="APBase Map pipeline: raw x, y, z input points are spatially filtered to remove invalid data and outliers, an automated variogram is fit, IDW, Kriging and CoKriging are cross-validated against each other, the model with the lowest RMSE is selected automatically, and the final interpolated raster map is produced.">
    <defs>
      <marker id="arrow2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
      </marker>
    </defs>

    <!-- background -->
    <rect x="0" y="0" width="1600" height="620" fill="#f6f5f0"/>

    <!-- header -->
    <g>
      <text x="50" y="66" font-size="27" font-weight="800" letter-spacing="0.5" fill="currentColor">AP</text>
      <rect x="50" y="72" width="33" height="2.5" fill="currentColor"/>
      <text x="110" y="66" font-size="28" font-weight="800" letter-spacing="-0.3" fill="currentColor">INTELLIGENT MAP PIPELINE</text>
      <text x="110" y="89" font-size="13.5" fill="#8c8777">automatic interpolation pipeline &#183; Python + Fortran</text>
      <line x1="50" y1="108" x2="1550" y2="108" stroke="currentColor" stroke-width="1.4"/>
    </g>

    <!-- ============ FLOW ============ -->

    <!-- A: input data -->
    <g>
      <circle cx="140" cy="330" r="52" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <g fill="currentColor">
        <circle cx="120" cy="315" r="4"/><circle cx="155" cy="308" r="4"/><circle cx="130" cy="345" r="4"/>
        <circle cx="166" cy="336" r="4"/><circle cx="115" cy="350" r="4"/><circle cx="150" cy="326" r="4"/>
        <circle cx="169" cy="355" r="4"/>
      </g>
      <text x="140" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">input data</text>
    </g>

    <line x1="192" y1="330" x2="332" y2="330" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow2)"/>
    <text x="262" y="238" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8c8777">intelligent local outliers removal</text>

    <!-- B: spatial filtering (funnel) -->
    <g>
      <circle cx="390" cy="330" r="58" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <g fill="currentColor">
        <circle cx="375" cy="300" r="2.5"/><circle cx="400" cy="296" r="2.5"/><circle cx="385" cy="305" r="2.5"/>
        <circle cx="408" cy="302" r="2.5"/><circle cx="368" cy="318" r="2.5"/>
      </g>
      <g stroke="currentColor" stroke-width="1.3" fill="none">
        <line x1="364" y1="312" x2="390" y2="338"/>
        <line x1="416" y1="312" x2="390" y2="338"/>
        <line x1="390" y1="338" x2="390" y2="356"/>
      </g>
      <g fill="currentColor">
        <circle cx="384" cy="362" r="2.8"/><circle cx="390" cy="368" r="2.8"/><circle cx="396" cy="362" r="2.8"/>
      </g>
      <g stroke="currentColor" stroke-width="1.1">
        <line x1="352" y1="318" x2="360" y2="326"/><line x1="360" y1="318" x2="352" y2="326"/>
        <line x1="420" y1="320" x2="428" y2="328"/><line x1="428" y1="320" x2="420" y2="328"/>
      </g>
      <text x="390" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">spatial filtering</text>
    </g>

    <line x1="448" y1="330" x2="582" y2="330" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow2)"/>
    <text x="515" y="238" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8c8777">automated variogram</text>

    <!-- C: variogram fit -->
    <g>
      <circle cx="640" cy="330" r="58" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="610" y1="300" x2="610" y2="362" stroke="currentColor" stroke-width="1.3"/>
      <line x1="610" y1="362" x2="672" y2="362" stroke="currentColor" stroke-width="1.3"/>
      <polyline points="618,354 626,343 634,331 642,321 650,315 658,312" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <g fill="currentColor">
        <circle cx="618" cy="354" r="2.2"/><circle cx="626" cy="343" r="2.2"/><circle cx="634" cy="331" r="2.2"/>
        <circle cx="642" cy="321" r="2.2"/><circle cx="650" cy="315" r="2.2"/><circle cx="658" cy="312" r="2.2"/>
      </g>
      <text x="640" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">variogram fit</text>
    </g>

    <line x1="698" y1="330" x2="800" y2="330" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="800" cy="330" r="3.5" fill="currentColor"/>
    <text x="749" y="238" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8c8777">candidate models</text>

    <!-- branch: IDW / Kriging / CoKriging -->
    <line x1="800" y1="330" x2="951.2" y2="199.8" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow2)"/>
    <line x1="800" y1="330" x2="942" y2="330" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow2)"/>
    <line x1="800" y1="330" x2="951.2" y2="460.2" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow2)"/>

    <!-- IDW (top) -->
    <g>
      <circle cx="980" cy="175" r="38" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="980" cy="175" r="17.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3,4"/>
      <circle cx="980" cy="175" r="10.2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3,4"/>
      <circle cx="980" cy="175" r="3.5" fill="currentColor"/>
      <text x="980" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">IDW</text>
    </g>

    <!-- Kriging (middle) -->
    <g>
      <circle cx="980" cy="330" r="38" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="980" cy="330" r="3.2" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="1.1">
        <line x1="980" y1="330" x2="1001.9" y2="330"/>
        <line x1="980" y1="330" x2="991" y2="311"/>
        <line x1="980" y1="330" x2="969" y2="311"/>
        <line x1="980" y1="330" x2="958.1" y2="330"/>
        <line x1="980" y1="330" x2="969" y2="349"/>
        <line x1="980" y1="330" x2="991" y2="349"/>
      </g>
      <g fill="currentColor">
        <circle cx="1001.9" cy="330" r="2.6"/><circle cx="991" cy="311" r="2.6"/><circle cx="969" cy="311" r="2.6"/>
        <circle cx="958.1" cy="330" r="2.6"/><circle cx="969" cy="349" r="2.6"/><circle cx="991" cy="349" r="2.6"/>
      </g>
      <text x="980" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Kriging</text>
    </g>

    <!-- CoKriging (bottom) -->
    <g>
      <circle cx="980" cy="485" r="38" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="980" cy="485" r="3.2" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="1.1">
        <line x1="980" y1="485" x2="1001.9" y2="485"/>
        <line x1="980" y1="485" x2="991" y2="466"/>
        <line x1="980" y1="485" x2="969" y2="466"/>
        <line x1="980" y1="485" x2="958.1" y2="485"/>
        <line x1="980" y1="485" x2="969" y2="504"/>
        <line x1="980" y1="485" x2="991" y2="504"/>
      </g>
      <g fill="currentColor">
        <circle cx="1001.9" cy="485" r="2.6"/><circle cx="991" cy="466" r="2.6"/><circle cx="969" cy="466" r="2.6"/>
        <circle cx="958.1" cy="485" r="2.6"/><circle cx="969" cy="504" r="2.6"/><circle cx="991" cy="504" r="2.6"/>
        <circle cx="1005.3" cy="470.4" r="2"/><circle cx="954.7" cy="470.4" r="2"/><circle cx="980" cy="514.2" r="2"/>
      </g>
      <text x="980" y="552" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">CoKriging</text>
    </g>

    <!-- merge: methods -> cross-validation -->
    <line x1="1011.4" y1="199.8" x2="1160" y2="330" stroke="currentColor" stroke-width="1.4"/>
    <line x1="1018" y1="330" x2="1160" y2="330" stroke="currentColor" stroke-width="1.4"/>
    <line x1="1011.4" y1="460.2" x2="1160" y2="330" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="1160" cy="330" r="3.5" fill="currentColor"/>
    <line x1="1168" y1="330" x2="1415" y2="330" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow2)"/>
    <text x="1291" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#8c8777">leave-one-out CV</text>
    <text x="1291" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#8c8777">automatic selection</text>

    <!-- final raster map -->
    <g>
      <rect x="1420" y="285" width="110" height="90" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <g stroke="#f6f5f0" stroke-width="1" fill="currentColor">
        <rect x="1420"   y="285"   width="27.5" height="22.5" opacity="0.10"/>
        <rect x="1447.5" y="285"   width="27.5" height="22.5" opacity="0.18"/>
        <rect x="1475"   y="285"   width="27.5" height="22.5" opacity="0.18"/>
        <rect x="1502.5" y="285"   width="27.5" height="22.5" opacity="0.10"/>

        <rect x="1420"   y="307.5" width="27.5" height="22.5" opacity="0.22"/>
        <rect x="1447.5" y="307.5" width="27.5" height="22.5" opacity="0.55"/>
        <rect x="1475"   y="307.5" width="27.5" height="22.5" opacity="0.62"/>
        <rect x="1502.5" y="307.5" width="27.5" height="22.5" opacity="0.24"/>

        <rect x="1420"   y="330"   width="27.5" height="22.5" opacity="0.20"/>
        <rect x="1447.5" y="330"   width="27.5" height="22.5" opacity="0.58"/>
        <rect x="1475"   y="330"   width="27.5" height="22.5" opacity="0.64"/>
        <rect x="1502.5" y="330"   width="27.5" height="22.5" opacity="0.22"/>

        <rect x="1420"   y="352.5" width="27.5" height="22.5" opacity="0.09"/>
        <rect x="1447.5" y="352.5" width="27.5" height="22.5" opacity="0.20"/>
        <rect x="1475"   y="352.5" width="27.5" height="22.5" opacity="0.19"/>
        <rect x="1502.5" y="352.5" width="27.5" height="22.5" opacity="0.09"/>
      </g>
      <rect x="1420" y="285" width="110" height="90" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="1475" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">interpolated map</text>
    </g>

    <!-- footer -->
    <line x1="50" y1="560" x2="1550" y2="560" stroke="currentColor" stroke-width="1.4"/>
    <text x="50" y="592" font-size="15" fill="currentColor" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Map(resolution=10.0)(x, y, z) &#8594; .to_raster()</text>
    <text x="1550" y="592" text-anchor="end" font-size="13" fill="#8c8777">kernel Fortran &#183; F2PY &#183; NumPy &#183; OpenMP</text>
  </svg>
