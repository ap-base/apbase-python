name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgfortran5 libgomp1 libopenblas0-pthread

      - name: Install package and test dependencies
        run: python -m pip install . pytest geopandas

      - name: Check native extension
        run: python -c "from apbase._native._lib import lib; lib.load()"

      - name: Run tests
        run: python -m pytest -q
