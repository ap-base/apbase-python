name: Build wheels

# Downloads the native module apbase._native.lib built for each platform and
# Python version from a release of the private ap-base/apbase-fortran-kernels,
# packs it into a repaired wheel, tests the wheel and, when `version` is set,
# uploads it to that release of this repository (pypi.yml publishes the
# release's wheels).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to upload the wheels to, e.g. 0.1.2 (empty: artifacts only)"
        type: string
        default: ""
      kernels_version:
        description: "Release tag of ap-base/apbase-fortran-kernels with the native modules"
        type: string
        required: true
      build_linux:
        description: "Build Linux wheels"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS wheels"
        type: boolean
        default: true
      build_windows:
        description: "Build Windows wheels"
        type: boolean
        default: true

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  linux:
    if: inputs.build_linux
    runs-on: ubuntu-latest
    # Official manylinux_2_28 image (AlmaLinux 8, glibc 2.28): the wheels then
    # install on Ubuntu 20.04+, Debian 11+, RHEL 8+. Building on the runner itself
    # would tag them with the runner's much newer glibc.
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        python-tag: [cp312-cp312, cp313-cp313, cp314-cp314]
    steps:
      - uses: actions/checkout@v7

      - name: Fortran/OpenBLAS runtime for auditwheel
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          toolset="$(ls -d /opt/rh/gcc-toolset-* | sort -V | tail -n1)"
          dnf install -y "$(basename "$toolset")-gcc-gfortran" openblas-devel

      - name: Python environment
        run: |
          /opt/python/${{ matrix.python-tag }}/bin/python -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Native module from the kernels release
        env:
          KERNELS_TOKEN: ${{ secrets.APBASE_KERNELS_TOKEN }}
        run: python .github/scripts/fetch_native_module.py "${{ inputs.kernels_version }}" src/apbase/_native

      - name: Build wheel
        run: |
          pip install --upgrade setuptools wheel
          pip wheel --no-cache-dir --no-deps --no-build-isolation -w dist .

      - name: Repair wheel (vendors libgfortran/libopenblas/libgomp)
        run: auditwheel repair --plat manylinux_2_28_x86_64 -w wheelhouse dist/*.whl

      - name: Test wheel
        run: |
          pip install wheelhouse/*.whl pytest
          python -c "from apbase._native._lib import lib; lib.load()"
          python -m pytest -q -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python-tag }}
          path: wheelhouse/*.whl

      - name: Upload wheel to the release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: apbase ${{ inputs.version }}
          files: wheelhouse/*.whl
          overwrite_files: true

  macos:
    if: inputs.build_macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [macos-14, macos-15-intel]
        include:
          - os: macos-14
            macos-arch: arm64
            macos-target: "14.0"
          - os: macos-15-intel
            macos-arch: x86_64
            macos-target: "14.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fortran/OpenBLAS runtime for delocate (Homebrew)
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install gcc openblas

      - name: Native module from the kernels release
        env:
          KERNELS_TOKEN: ${{ secrets.APBASE_KERNELS_TOKEN }}
        run: python .github/scripts/fetch_native_module.py "${{ inputs.kernels_version }}" src/apbase/_native

      - name: Build wheel
        run: |
          pip install --upgrade setuptools wheel
          export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos-target }}"
          export _PYTHON_HOST_PLATFORM="macosx-${MACOSX_DEPLOYMENT_TARGET}-${{ matrix.macos-arch }}"
          pip wheel --no-cache-dir --no-deps --no-build-isolation -w dist .

      - name: Repair wheel (vendors libgfortran/libopenblas/libgomp)
        run: |
          pip install delocate
          delocate-wheel -w wheelhouse --require-archs="${{ matrix.macos-arch }}" -v dist/*.whl

      - name: Test wheel
        run: |
          pip install wheelhouse/*.whl pytest
          python -c "from apbase._native._lib import lib; lib.load()"
          python -m pytest -q -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.macos-arch }}-${{ matrix.python-version }}
          path: wheelhouse/*.whl

      - name: Upload wheel to the release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || {
            gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
              --title "apbase ${VERSION}" --notes "Wheels for apbase ${VERSION}." \
            || gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          }
          gh release upload "${VERSION}" wheelhouse/*.whl --repo "${GITHUB_REPOSITORY}" --clobber

  windows:
    if: inputs.build_windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fortran/OpenBLAS runtime for delvewheel (MSYS2)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-openblas mingw-w64-x86_64-pkgconf
          cache: false

      - name: Native module from the kernels release
        env:
          KERNELS_TOKEN: ${{ secrets.APBASE_KERNELS_TOKEN }}
        run: python .github/scripts/fetch_native_module.py "${{ inputs.kernels_version }}" src/apbase/_native

      - name: Build wheel
        run: |
          pip install --upgrade setuptools wheel
          pip wheel --no-cache-dir --no-deps --no-build-isolation -w dist .

      - name: Repair wheel (vendors libgfortran/libopenblas/libgomp DLLs)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          pip install delvewheel
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          delvewheel repair --add-path $mingwBin -w wheelhouse (Get-Item dist\*.whl).FullName

      - name: Test wheel
        shell: pwsh
        run: |
          pip install (Get-Item wheelhouse\*.whl).FullName pytest
          python -c "from apbase._native._lib import lib; lib.load()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: wheelhouse/*.whl

      - name: Upload wheel to the release
        if: inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || {
            gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
              --title "apbase ${VERSION}" --notes "Wheels for apbase ${VERSION}." \
            || gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          }
          gh release upload "${VERSION}" wheelhouse/*.whl --repo "${GITHUB_REPOSITORY}" --clobber
