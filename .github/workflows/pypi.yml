name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag of this repository whose wheels are published (e.g. 0.1.3)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download the wheels of release ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --repo ${{ github.repository }} --pattern '*.whl' --dir dist

      - name: Check the downloaded wheels
        run: |
          shopt -s nullglob
          whls=(dist/*.whl)
          if [ ${#whls[@]} -eq 0 ]; then
            echo "::error::release ${{ inputs.tag }} has no .whl" >&2
            exit 1
          fi
          printf '%s\n' "${whls[@]}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
