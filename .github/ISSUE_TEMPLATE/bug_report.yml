name: Bug report
description: Wrong result, crash or installation failure.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, use the private
        [vulnerability report](https://github.com/ap-base/apbase-python/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What went wrong, and the full error message or traceback if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal example
      description: The smallest script (and data, if small) that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: apbase version
      placeholder: "0.1.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - macOS arm64 (Apple Silicon)
        - macOS x86_64 (Intel)
        - Windows x86_64
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Other environment details
      description: How apbase was installed (PyPI wheel or git), NumPy, pyproj and Shapely versions, anything else relevant.
