[build-system]
requires = [
  "setuptools>=69.5",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "apbase"
version = "0.1.0"
description = "APBase geospatial filtering, variogram, kriging and IDW modules"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "numpy>=2.0",
  "pyproj>=3.6,<4.0",
  "shapely>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"apbase" = ["py.typed"]
"apbase._native" = ["*.so", "*.pyd", "*.dll", "*.dylib", "*.o"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/apbase"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
